name: build and release chuckya-fe

on:
  schedule:
    - cron: "00 06 * * *"
  push:
  workflow_dispatch:

jobs:
  build-chuckya:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: set up node
        uses: actions/setup-node@v4
        with:
          node-version: latest

      - name: enable corepack
        run: |
          mkdir -p $HOME/.local/bin
          corepack enable --install-directory $HOME/.local/bin

      - name: compile masto-fe
        run: |
          git clone https://forged.synth.download/sd/chuckya-fe.git && chmod +x ${GITHUB_WORKSPACE}/symlink.sh && cd chuckya-fe
          export COREPACK_ENABLE_DOWNLOAD_PROMPT=0 && npx --yes update-browserslist-db@latest && $HOME/.local/bin/yarn && $HOME/.local/bin/yarn build:production
          cd public && cp ${GITHUB_WORKSPACE}/symlink.sh . && zip -r ${GITHUB_WORKSPACE}/chuckya-fe.zip .

      - name: release zip
        uses: softprops/action-gh-release@v2
        with:
          tag_name: fedi-frontends
          make_latest: true
          files: chuckya-fe.zip